plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}

group = 'expo.modules.alarmruntime'
version = '0.1.0'

android {
  namespace 'expo.modules.alarmruntime'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
